# Bank Manager on Azure Container Apps with Lakebase. Every run builds the image and checks the Bicep; a manual run with
# deploy=true also migrates the database, creates the app's database role, builds into the registry, rolls out
# infra/main.bicep and plays through the deployed server. Run `lakebase` first.
#
#   repo secrets    AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#                   (an app registration with a federated credential for this repo, UstDoesTech/bank-manager; it needs
#                   Contributor and User Access Administrator on the resource group)
#                   Repo variables RESOURCE_GROUP and ACR_NAME are optional. They default to the playground's
#                   rg-personal-n-ust-ust-built-on-playground and its registry builtonplayground, which this app
#                   reuses with the Container Apps environment managedEnvironment-rgpersonalnustu-b3e2.
#   repo secrets    DATABRICKS_HOST, DATABRICKS_CLIENT_ID, DATABRICKS_CLIENT_SECRET
#                       the admin service principal: it applies the migrations and creates the role below
#                   BANK_DATABRICKS_CLIENT_ID, BANK_DATABRICKS_CLIENT_SECRET
#                       a separate service principal the running app signs in as. It gets read and write on the account
#                       and bank schemas and nothing else (it cannot change the schema).
name: deploy
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Azure (otherwise build only)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep build --file infra/main.bicep --stdout >/dev/null
      - run: docker build -t bank-manager .

  deploy:
    needs: image
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      APP_ID: ${{ secrets.BANK_DATABRICKS_CLIENT_ID }}
      APP_SECRET: ${{ secrets.BANK_DATABRICKS_CLIENT_SECRET }}
      RG: ${{ vars.RESOURCE_GROUP || 'rg-personal-n-ust-ust-built-on-playground' }}
      ACR: ${{ vars.ACR_NAME || 'builtonplayground' }}
      EP: projects/bank-manager/branches/production/endpoints/primary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --omit=dev
      - uses: databricks/setup-cli@main
      - name: Lakebase endpoint host, and wake it if it is off
        run: |
          set -e
          echo "::add-mask::$APP_ID"
          [[ "$APP_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::BANK_DATABRICKS_CLIENT_ID is missing or not a client ID"; exit 1; }
          dis=$(databricks postgres get-endpoint "$EP" -o json | jq -r '.status.disabled')
          if [ "$dis" = true ]; then
            databricks postgres update-endpoint "$EP" spec.disabled --json '{"spec":{"disabled":false}}' -o json >/dev/null
          fi
          host=$(databricks postgres get-endpoint "$EP" -o json | jq -r '.status.hosts.host')
          [ -n "$host" ] && [ "$host" != null ]
          echo "PG_HOST=$host" >> "$GITHUB_ENV"
      - name: Apply the migrations as the administrator
        env:
          LAKEBASE_ENDPOINT: ${{ env.EP }}
          PGDATABASE: bank
        run: PGHOST="$PG_HOST" node server/migrate.js
      - name: Postgres role for the app, read and write on its schemas only
        run: |
          set +e
          scripts/pg.sh -q \
            -c "CREATE EXTENSION IF NOT EXISTS databricks_auth;" \
            -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '$APP_ID') THEN PERFORM databricks_create_role('$APP_ID', 'SERVICE_PRINCIPAL'); END IF; END \$\$;" \
            -c "GRANT USAGE ON SCHEMA account, bank TO \"$APP_ID\"; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA account, bank TO \"$APP_ID\"; GRANT USAGE ON ALL SEQUENCES IN SCHEMA account, bank TO \"$APP_ID\"; ALTER DEFAULT PRIVILEGES IN SCHEMA account, bank GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO \"$APP_ID\";" >"$RUNNER_TEMP/pgout" 2>&1
          code=$?
          echo "::notice title=lakebase role exit=${code}::$(grep -v '^::add-mask::' "$RUNNER_TEMP/pgout" | tr '\n' '|' | cut -c1-600)"
          exit $code
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build the image in the existing registry
        run: az acr build -r "$ACR" -t "bank-manager:${{ github.sha }}" . --no-logs
      - name: Create or update the app
        run: |
          set -e
          echo "::add-mask::$APP_SECRET"
          server=$(az acr show -n "$ACR" --query loginServer -o tsv)
          az deployment group create -g "$RG" -n bank-manager-app -f infra/main.bicep -o none \
            -p acrName="$ACR" image="$server/bank-manager:${{ github.sha }}" databricksHost="$DATABRICKS_HOST" \
               databricksClientId="$APP_ID" databricksClientSecret="$APP_SECRET" pgHost="$PG_HOST"
          url=$(az deployment group show -g "$RG" -n bank-manager-app --query properties.outputs.url.value -o tsv)
          echo "APP_URL=$url" >> "$GITHUB_ENV"
          echo "::notice title=bank manager::$url"
      - name: Play through the deployed server
        run: |
          for i in $(seq 1 30); do curl -fs "$APP_URL/healthz" >/dev/null && break; sleep 5; done
          scripts/smoke.sh "$APP_URL"
