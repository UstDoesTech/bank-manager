<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bank Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="web/style.css">
</head>
<body>

<div id="app" data-view="counter">
  <header id="hud">
    <div class="hud-top">
      <button class="menu" id="menuBtn" type="button" aria-label="Menu" title="Menu">☰</button>
      <h1 class="brand">Bank Manager</h1>
      <div class="when" id="hWhen">Jan 2027</div>
      <button class="reg ok" id="hReg" type="button">Good</button>
      <button class="reg goals" id="goalsBtn" type="button" hidden>Goals</button>
      <button class="reg goals" id="hhBtn" type="button" hidden>Customers</button>
      <div class="sp"></div>
      <button class="cont" id="contBtn" type="button">Continue</button>
    </div>
    <div class="kpis">
      <button class="kpi" type="button" data-term="Profit"><span>Profit</span><b id="mProfit">£0</b></button>
      <button class="kpi" type="button" data-term="Capital ratio"><span>Capital</span><b id="mCap">0%</b></button>
      <button class="kpi" type="button" data-term="Liquidity"><span>Liquidity</span><b id="mLiq">0%</b></button>
      <button class="kpi" type="button" data-term="Customer trust"><span>Customers</span><b id="mTrust">60</b></button>
    </div>
  </header>
  <nav id="tabs" aria-label="Sections">
    <button type="button" id="tabCounter" data-tab="counter" aria-current="true">Counter<b id="nCounter"></b></button>
    <button type="button" id="tabInbox" data-tab="inbox" aria-current="false">Inbox<b id="nInbox"></b></button>
    <button type="button" id="bankBtn" aria-current="false">Bank</button>
    <button type="button" id="policyBtn" aria-current="false" hidden>Policy</button>
  </nav>
  <main id="main">
    <div id="stage">
      <canvas id="c" aria-label="The view from your teller window"></canvas>
      <div id="booth" aria-hidden="true"><i class="glare"></i><i class="sill"></i></div>
      <div id="bubble" hidden></div>
      <div id="float"></div>
      <div id="ticker"></div>
    </div>
    <section id="desk" aria-live="polite">
      <div id="docs"><div id="docsIn"></div></div>
      <div id="tray"></div>
    </section>
    <section id="inbox">
      <div id="mlist"></div>
      <div id="mview" aria-live="polite"></div>
    </section>
  </main>
</div>
<div id="ov" hidden></div>
<div id="pop" hidden></div>
<div id="cookieNote" role="region" aria-label="Cookie notice" hidden><span>This game uses a cookie to record your game sessions.</span><button type="button" id="cookieOk">OK</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="engine/engine.js"></script>
<script src="web/scene.js"></script>
<script src="web/ui.js"></script>
<script src="web/screens.js"></script>
<script src="web/online.js"></script>

</body></html>
