}
const dayOf = id => (id * 7) % 27 + 1;
function addMail(from, subject, body, tone, m, y){ S.inbox = S.inbox || []; S.mailId = (S.mailId || 0) + 1; S.inbox.push({ id:S.mailId, from, subject, body, tone: tone || '', when:`${dayOf(S.mailId)} ${MONTHS[m].slice(0, 3)} ${y}`, read:false }); if (S.inbox.length > 60) S.inbox.splice(0, S.inbox.length - 60); }

    const o = c.opts.find(x => x.k === c.done);

    S.inbox.push({ id:S.mailId, from: fromOf(c), subject: subjOf(c), body: c.note, tone:'', when:`${dayOf(c.id)} ${MONTHS[S.month].slice(0, 3)} ${S.year}`, read:true, reply:{ label: o ? o.l : 'Done', lines:(c.out ? c.out.lines : []).map(l => l.t) } });

}
function mailMonth(rep, prevMonth, prevYear){
  for (const e of rep.events) addMail(senderOf(e.t), firstSentence(e.t), e.t, e.tone, prevMonth, prevYear);
  if (rep.next) addMail('Economics desk', `${MONTHS[S.month]} outlook`, `Unemployment ${rep.next.unemp.toFixed(1)}%. House prices ${(rep.next.hpi * 100 >= 0 ? '+' : '')}${(rep.next.hpi * 100).toFixed(1)}% this year. Bank Rate ${rep.next.base.toFixed(2)}%. Inflation ${inflation().toFixed(1)}%, so savings at the best easy-access rate return ${(mkt() - inflation() >= 0 ? '+' : '')}${(mkt() - inflation()).toFixed(1)}% a year after rising prices. Shares ${(S.mkt / S.mktY0 - 1 >= 0 ? '+' : '')}${pc(S.mkt / S.mktY0 - 1)} this year.`, '', prevMonth, prevYear);
}
function welcomeMail(){
  if ((S.inbox || []).length || S.month !== 0 || S.over) return;
  if (S.scenario){ const sc = SCENARIOS[S.scenario]; addMail('The board', `Briefing: ${sc.name}`, `${sc.blurb} You have one year. Your goals: ${sc.goals.map(g => g.label.toLowerCase()).join('; ')}. Tap Goals at the top to check progress.`, '', 0, S.year); }
  else if (S.tutorial) addMail('Your trainer', 'Training day', 'Welcome to your first day. Each customer at the counter and each message today comes with a yellow note from me explaining what to look for. Decide for yourself, then see what happens. From February you are on your own. The Branch tab lets you spend money on staff and systems; Books shows the balance sheet.', '', 0, S.year);
  else addMail('The board', 'Welcome to Counting House', 'You are the new manager. Customers come to your counter; everything else lands here. Reply to anything marked Response required, serve the queue, then press Continue to close the month. The Branch tab lets you invest in staff and systems. The board judges you on profit against peer banks, on how customers are treated and on your standing with the regulator.', '', 0, S.year);
}
function markRead(key){ const id = +key.slice(1); const it = key[0] === 'c' ? S.queue.find(x => x.id === id) : (S.inbox || []).find(x => x.id === id); if (it) it.read = true; }

/* ---- command interface: the only way the outside world changes the game ----
   A game is fully defined by its seed, engine version and the ordered list of commands. */
function dispatch(cmd){
  const out = dispatchInner(cmd);
  if (LEDGER_STRICT && S && S.ledger){ const bad = ledgerCheck(); if (bad.length) throw new Error('ledger check failed after ' + cmd.type + ': ' + bad.join('; ')); }
  return out;
}
function dispatchInner(cmd){
  switch (cmd.type){
    case 'newGame': return newGame(cmd.seed, cmd.opts || {});

}

const Snd = (() => {

  function ac(){ if (!ctx){ try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (ctx.state === 'suspended') ctx.resume().catch(() => {}); return ctx; }
  function out(v){ const g = ctx.createGain(); g.gain.value = v; g.connect(ctx.destination); return g; }

  const fx = {
    stamp(){ const t = ctx.currentTime, n = noise(0.09, 3), f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1100; n.connect(f); f.connect(out(0.8)); n.start(t); tone(120, t, 0.16, 'sine', 0.55, 50); },
    paper(){ const t = ctx.currentTime, n = noise(0.28, 1.2), f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2600; f.Q.value = 0.6; n.connect(f); f.connect(out(0.22)); n.start(t); },
    bell(){ const t = ctx.currentTime; tone(1568, t, 1.3, 'sine', 0.16); tone(3920, t, 0.5, 'sine', 0.04); tone(2350, t, 0.9, 'sine', 0.03); },
    coin(){ const t = ctx.currentTime; tone(1318, t, 0.12, 'triangle', 0.13); tone(1976, t + 0.07, 0.3, 'triangle', 0.11); },
    bad(){ const t = ctx.currentTime; tone(233, t, 0.22, 'sawtooth', 0.035, 220); tone(175, t + 0.13, 0.4, 'sawtooth', 0.035, 160); },
    mail(){ const t = ctx.currentTime; tone(988, t, 0.1, 'sine', 0.07); tone(1319, t + 0.09, 0.2, 'sine', 0.07); },
    click(){ tone(700, ctx.currentTime, 0.035, 'square', 0.02); },
    vault(){ const t = ctx.currentTime; tone(70, t, 0.6, 'sine', 0.35, 45); const n = noise(0.5, 2), f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 400; n.connect(f); f.connect(out(0.4)); n.start(t + 0.05); },
  };

    toggle(){ on = !on; try { localStorage.setItem('bm-sound', on ? '1' : '0'); } catch (e) {} if (on) ac(); return on; },
    get on(){ return on; },
  };
})();

function replyMsg(c, i){

/* ---------- The Fiscal Herald ---------- */
function heraldStories(){
  const st = S.stats, r = rating(), c = [];
  const fail = { capital:['Counting House collapses as losses wipe out capital', 'The regulator has put the high street bank into resolution. Most savers are covered by the deposit guarantee scheme.'], licence:['Regulator shuts Counting House', 'The bank has lost its licence after a string of failings. Customers are being moved to another bank.'], sacked:['Counting House chief executive ousted', 'The board has removed the chief executive. Directors say they had lost confidence in the leadership.'], resigned:['Counting House chief executive steps down', 'The chief executive has resigned. The board has thanked them and begun a search for a successor.'], run:['Savers queue around the block as Counting House runs out of money', 'The bank could not pay depositors who wanted their money back. The Bank of England has stepped in.'] }[S.over];
  if (fail) c.push({ w:100, head:fail[0], body:fail[1] });
  for (const n of S.news || []) c.push({ w:n.w + n.m / 30, head:n.head, body:n.body });
  const yr = P().name.replace(/^an? /, '');
  if (!fail) c.push(r.profit >= 0 ? { w:4 + Math.max(0, r.roe - r.peer) * 25, head:`Counting House makes ${fmt(r.profit)} in a year of ${yr}`, body:`A return on capital of ${pc(r.roe)}, against about ${pc(r.peer, 0)} for similar banks.` } : { w:4 + Math.max(0, r.peer - r.roe) * 25, head:`Counting House loses ${fmt(-r.profit)} in a year of ${yr}`, body:`A return on capital of ${pc(r.roe)}. Similar banks managed about ${pc(r.peer, 0)}.` });
  if (st.scamStop >= 2) c.push({ w:3 + st.scamStop, head:`Branch staff stopped ${st.scamStop} scams this year`, body:'Cashiers called police while customers were still on the phone to fraudsters.' });
  if (st.scamMiss >= 2) c.push({ w:2 + st.scamMiss, head:`${st.scamMiss} customers scammed in branch`, body:'Victims say staff did not ask enough questions.' });
  if (st.fines >= 60) c.push({ w:4 + st.fines / 60, head:`Fines and refunds cost Counting House ${fmt(st.fines)}`, body:'The bank says it has tightened its controls.' });
  if (st.defaults >= 3) c.push({ w:3 + st.defaults / 2, head:'Borrowers fall behind as bad loans mount', body:`The bank wrote off ${st.defaults} new loans, costing ${fmt(st.losses)}.` });
  if (st.wrongNo >= 3) c.push({ w:3, head:'Applicants say they were turned away', body:`At least ${st.wrongNo} people with good records were refused.` });
  if (st.lent > 1500) c.push({ w:3 + st.lent / 2500, head:`${fmt(st.lent)} lent to local homes and firms`, body:`${st.loans} new loans this year.` });
  if (st.sars >= 3) c.push({ w:2, head:`Bank files ${st.sars} suspicious activity reports`, body:'Reports go to the National Crime Agency.' });
  { const real = mkt() - inflation(11); if (real < -0.75) c.push({ w:3.5, head:'Savers lose ground as prices outpace interest', body:`The best easy-access rate is ${mkt().toFixed(2)}% while prices rose ${inflation(11).toFixed(1)}%. Money in savings buys about ${Math.abs(real).toFixed(1)}% less than a year ago.` }); else if (real > 1) c.push({ w:2.5, head:'Savers finally beat inflation', body:`Easy-access accounts pay ${mkt().toFixed(2)}% against inflation of ${inflation(11).toFixed(1)}%.` }); }
  if (S.wm && aum() > 3000) c.push({ w:3, head:`Wealth arm now manages ${fmt(aum())}`, body:'Fees rise and fall with the stock market.' });
  const seen = new Set(); return c.sort((a, b) => b.w - a.w).filter(x => !seen.has(x.head) && seen.add(x.head));
}

/* ---------- Recording games on the server (optional) ----------
   Served from the game server and signed in, every game is also recorded there: the page plays on its own engine
   as always, and each command is sent in order. The server re-runs the commands itself. Offline or signed out,
   nothing changes. Unsent commands are kept in localStorage and flushed when the connection or session returns. */
const Remote = (() => {
  const KEY = 'bm-remote';
  let me = null, rec = null, chain = Promise.resolve();
  const available = () => /^https?:/.test(location.protocol);
  const store = () => { try { rec ? localStorage.setItem(KEY, JSON.stringify(rec)) : localStorage.removeItem(KEY); } catch (e) {} };
  async function api(method, url, body){
    const r = await fetch(url, { method, credentials: 'same-origin', headers: body ? { 'content-type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
    let json = null; try { json = await r.json(); } catch (e) {}
    return { ok: r.ok, status: r.status, json: json || {} };
  }
  async function init(){
    if (!available()) return;
    try { me = (await api('GET', '/api/me')).json; if (!me.signedIn) me = null; } catch (e) { me = null; }
    try { rec = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { rec = null; }
    flush();
  }
  const ready = () => !!(me && me.signedIn && me.consented && !(me.guest && optedOut()));      // a guest who said no is not recorded
  async function create(opts){
    try { const r = await api('POST', '/api/games', opts); if (!r.ok) return null; rec = { id: r.json.id, seq: 1, pending: [] }; store(); return r.json; }
    catch (e) { return null; }
  }
  function drop(){ rec = null; store(); }
  // Called after every command the page's own engine accepts.
  function record(cmd, out){
    if (!rec || cmd.type === 'newGame' || cmd.type === 'read') return;       // reading mail changes no money, so it is not sent
    if ((cmd.type === 'resolve' || cmd.type === 'buy') && !out) return;      // the engine refused it
    const c = { type: cmd.type }; if (cmd.type === 'resolve'){ c.id = cmd.id; c.k = cmd.k; } if (cmd.type === 'buy') c.key = cmd.key;
    if (cmd.type === 'setPolicy'){ c.area = cmd.area; if (cmd.release) c.release = true; else c.values = cmd.values; }
    if (cmd.type === 'stress' && cmd.overrides) c.overrides = cmd.overrides;
    rec.pending.push(c); store(); flush();
  }
  function flush(){
    chain = chain.then(async () => {
      while (rec && me && rec.pending.length){
        let r; try { r = await api('POST', '/api/games/' + rec.id + '/commands', { seq: rec.seq + 1, command: rec.pending[0] }); } catch (e) { return; }   // offline: try again later
        if (r.ok){ rec.seq++; rec.pending.shift(); store(); continue; }
        if (r.status === 401){ me = null; return; }                                                       // session ended: keep the queue
        if (r.json.error === 'out_of_sequence' && r.json.expected === rec.seq + 2){ rec.seq++; rec.pending.shift(); store(); continue; }   // the reply was lost but the command landed
        console.warn('Recording stopped:', r.json.error || r.status); drop(); return;
      }
    });
  }
  const who = () => me && (me.email || 'a guest');
  // Anonymous recording: a game started without an account is recorded under a random key (no email), unless the player said no.
  const NO = 'bm-norecord';
  const optedOut = () => { try { return localStorage.getItem(NO) === '1'; } catch (e) { return false; } };
  const setOptedOut = (v) => { try { v ? localStorage.setItem(NO, '1') : localStorage.removeItem(NO); } catch (e) {} };
  async function guest(){
    if (!available() || me || optedOut()) return;
    try { const r = await api('POST', '/api/guest', {}); if (!r.ok) return; me = (await api('GET', '/api/me')).json; if (!me.signedIn) me = null; } catch (e) { me = null; }
  }
  return { optedOut, setOptedOut, guest, available, init, ready, create, drop, record, flush, api, me: () => me, setMe: (m) => { me = m && m.signedIn ? m : null; }, who, recording: () => !!rec, settled: () => chain, gameId: () => rec && rec.id };
})();
{ const engineDispatch = dispatch; dispatch = function(cmd){ const out = engineDispatch(cmd); Remote.record(cmd, out); return out; }; }

/* Financial literacy check: five questions before the first recorded game and one more after each year played.
   Optional, and only for signed-in players who have accepted the notice. The server holds the answers and does the scoring. */
async function literacyCheck(only){
  const m = Remote.me();
  if (!Remote.ready() || !m || !m.consented || m.guest) return;
  let st; try { const r = await Remote.api('GET', '/api/literacy'); if (!r.ok) return; st = r.json; } catch (e) { return; }
  if (!st.due || (only && st.phase !== only)) return;
  await new Promise(done => {
    const qs = st.questions.map((q, i) => '<fieldset class="lq"><legend>' + (i + 1) + '. ' + esc(q.text) + '</legend>' + q.options.map(o => '<label class="chk"><input type="radio" name="lq_' + q.id + '" value="' + o.k + '"> ' + esc(o.t) + '</label>').join('') + '</fieldset>').join('');
    overlay('<div class="eyebrow">' + (st.phase === 'before' ? 'Before you start' : 'After year ' + st.yearsPlayed) + ' · optional</div><h2>Five quick questions</h2><p class="dim">Not part of the game. They help show whether playing teaches anything. Answers are kept without your name or email. "Not sure" is a fine answer.</p><div class="acct" id="lqForm">' + qs + '<div class="msg" id="lqMsg" role="status"></div><button type="button" class="btn primary" id="lqGo">Submit</button><button type="button" class="btn link" id="lqSkip">Skip for now</button></div>');
    $('#lqSkip').onclick = () => { closeOverlay(); done(); };
    $('#lqGo').onclick = async () => {
      const answers = {}; for (const q of st.questions){ const c = document.querySelector('input[name="lq_' + q.id + '"]:checked'); if (!c){ $('#lqMsg').textContent = 'Please answer every question, or skip.'; return; } answers[q.id] = c.value; }
      $('#lqGo').disabled = true;
      const r = await Remote.api('POST', '/api/literacy', { answers, gameId: Remote.gameId() || undefined });
      if (!r.ok){ $('#lqMsg').textContent = (r.json && r.json.message) || 'Could not save that. You can skip.'; $('#lqGo').disabled = false; return; }
      overlay('<div class="eyebrow">Thank you</div><h2>You got ' + r.json.score + ' of 5</h2>' + r.json.results.map(x => '<div class="note"><div class="eyebrow">' + esc(x.concept) + ' · ' + (x.correct ? 'right' : 'not quite') + '</div><p>' + esc(x.why) + '</p></div>').join('') + '<div class="rowbtn"><button type="button" class="btn primary" id="lqDone">Continue</button></div>');
      $('#lqDone').onclick = () => { closeOverlay(); done(); };
    };
  });
}
async function offerLiteracy(){
  const m = Remote.me(); if (!Remote.ready() || !m || !m.consented || m.guest || S.scenario || S.over !== 'done') return;
  await Remote.settled();                                    // the year's last command must reach the server first
  let st; try { const r = await Remote.api('GET', '/api/literacy'); if (!r.ok || !r.json.due) return; st = r.json; } catch (e) { return; }
  const row = document.querySelector('#ov .rowbtn'); if (!row || document.getElementById('ovLit')) return;
  const b = document.createElement('button'); b.type = 'button'; b.className = 'btn neutral'; b.id = 'ovLit'; b.textContent = 'Five quick questions (optional)';
  b.onclick = async () => { await literacyCheck(); endScreen(); };
  row.insertBefore(b, row.firstChild);
}

async function startGame(opts = {}){
  if (!opts.tutorial && !opts.scenario && opts.households === undefined) opts = Object.assign({}, opts, { households: true });
  clearSave(); Remote.drop();
  let seed = null;
  await Remote.guest();
  if (Remote.ready()){ await literacyCheck('before'); const g = await Remote.create(opts); if (g) seed = g.seed; }
  dispatch({ type:'newGame', seed, opts }); save(); play();
}

function accountScreen(msg, isErr){
  const m = Remote.me(), note = (t, err) => `<div class="msg${err ? ' err' : ''}" role="status">${esc(t || '')}</div>`;
  const back = '<button type="button" class="btn link" id="acBack">Back</button>';
  if (m && !m.consented){
    overlay(`<div class="eyebrow">Before your first recorded game</div><h2>What gets recorded</h2>
      <p>While you are signed in, each decision you make and what happened as a result is saved on the game server, along with the bank's ledger. Everything in the game is invented. Your email address and password are kept apart from the game data.</p>
      <p>You can keep your games out of any analysis, and you can delete your account and every game at any time.</p>
      <div class="acct"><label class="chk"><input type="checkbox" id="acOpt"> Keep my games out of analysis</label>${note(msg, isErr)}
      <button type="button" class="btn primary" id="acOk">Start recording my games</button>${back}</div>`);
    $('#acOk').onclick = async () => { const r = await Remote.api('POST', '/api/consent', { optOut: $('#acOpt').checked }); if (r.ok){ Remote.setMe({ ...m, consented: true, signedIn: true }); accountScreen('Recording is on. Games you start from now on are saved.'); } else accountScreen(r.json.message, true); };
    $('#acBack').onclick = titleScreen; return;
  }
  if (m && !m.guest){
    overlay(`<div class="eyebrow">Signed in</div><h2>${esc(Remote.who())}</h2>
      <p>${Remote.recording() ? 'The game you are playing is being recorded.' : 'New games you start are recorded.'}${m.analysisOptOut ? ' They are kept out of analysis.' : ''}</p>
      <div class="acct">${note(msg, isErr)}
      <button type="button" class="btn neutral" id="acOut">Sign out</button>
      <details class="more"><summary>Delete my account</summary><div class="acct" style="margin-top:8px"><label>Password<input type="password" id="acDelPw" autocomplete="current-password"></label>
      <button type="button" class="btn no" id="acDel">Delete my account and every recorded game</button></div></details>${back}</div>`);
    $('#acOut').onclick = async () => { await Remote.api('POST', '/api/logout', {}); Remote.setMe(null); accountScreen('Signed out.'); };
    $('#acDel').onclick = async () => { const r = await Remote.api('DELETE', '/api/me', { password: $('#acDelPw').value }); if (r.ok){ Remote.setMe(null); Remote.drop(); accountScreen('Your account and games are deleted.'); } else accountScreen(r.json.message, true); };
    $('#acBack').onclick = titleScreen; return;
  }
  overlay(`<div class="eyebrow">Account</div><h2>Save your games</h2>
    ${m && m.guest ? `<p>Sign in or create an account to keep your games under your own login.</p>` : '<p>Sign in to keep your games under your own login.</p>'}
    <form class="acct" id="acForm" novalidate>
      <label>Email<input type="email" id="acEmail" autocomplete="username" required></label>
      <label>Password<input type="password" id="acPw" autocomplete="current-password" minlength="10" required></label>
      ${note(msg, isErr)}
      <button type="submit" class="btn primary" id="acIn">Sign in</button>
      <button type="button" class="btn neutral" id="acReg">Create account</button>
      <button type="button" class="btn link" id="acForgot">Forgot password</button>${back}
    </form>`);
  const creds = () => ({ email: $('#acEmail').value.trim(), password: $('#acPw').value });
  $('#acForm').onsubmit = async (e) => { e.preventDefault(); const r = await Remote.api('POST', '/api/login', creds());
    if (!r.ok) return accountScreen(r.json.message || 'Could not sign in.', true);
    Remote.setMe((await Remote.api('GET', '/api/me')).json); await Remote.init(); accountScreen(); };
  $('#acReg').onclick = async () => { const r = await Remote.api('POST', '/api/register', creds()); if (r.ok && m && m.guest){ try { Remote.setMe((await Remote.api('GET', '/api/me')).json); } catch (e) {} } accountScreen(r.ok ? r.json.message : r.json.message || 'Could not register.', !r.ok); };
  $('#acForgot').onclick = async () => { const r = await Remote.api('POST', '/api/forgot', { email: $('#acEmail').value.trim() }); accountScreen(r.json.message || 'Enter your email address first.', !r.ok); };
  $('#acBack').onclick = titleScreen;
}
function resetScreen(token){
  overlay(`<div class="eyebrow">Account</div><h2>Choose a new password</h2>
    <form class="acct" id="rsForm"><label>New password (10 or more characters)<input type="password" id="rsPw" autocomplete="new-password" minlength="10" required></label><div class="msg" id="rsMsg" role="status"></div>
    <button type="submit" class="btn primary">Save password</button></form>`);
  $('#rsForm').onsubmit = async (e) => { e.preventDefault(); const r = await Remote.api('POST', '/api/reset', { token, password: $('#rsPw').value });
    history.replaceState(null, '', location.pathname); if (r.ok) accountScreen('Password changed. Sign in with it.'); else $('#rsMsg').textContent = r.json.message || 'That did not work.'; };
}

function titleScreen(){
  const saved = load(), resumable = saved && (!saved.over || saved.over === 'done');
  let best = null; try { best = JSON.parse(localStorage.getItem('ch-best') || 'null'); } catch (e) {}
  overlay(`<p class="title-xl">Bank<br>Manager</p>
    <p>Run a small high-street bank. Serve customers, answer your inbox, and make money without failing your customers or the regulator.</p>
    ${best ? `<p class="num" style="color:var(--brass);font-size:13px;margin:0">Best rating so far: ${esc(best.letter)}</p>` : ''}
    <div class="rowbtn">
      ${resumable ? `<button type="button" class="btn primary" id="ovGo">${saved.scenario ? esc(SCENARIOS[saved.scenario].name) + ' · ' : ''}${saved.over ? `Year-end ${saved.year}` : `Continue · ${MONTHS[saved.month]} ${saved.year}`}</button>` : ''}
      <button type="button" class="btn ${resumable ? 'neutral' : 'primary'}" id="${best ? 'ovNew' : 'ovTrain'}">${best ? 'New career' : 'Start with a training day'}</button>
      <button type="button" class="btn link" id="${best ? 'ovTrain' : 'ovNew'}">${best ? 'New career with a training day' : 'Skip the training'}</button>
      <button type="button" class="btn link" id="ovScen">Scenarios: 2008, 2020 and 2022 crises</button>
      ${Remote.available() ? `<button type="button" class="btn link" id="ovAcct">${Remote.ready() ? (Remote.me().guest ? 'Playing as a guest · sign in to keep your games' : 'Recording as ' + esc(Remote.who())) : 'Sign in to save your games'}</button>` : ''}
    </div>
    ${resumable ? '<p style="color:var(--muted);font-size:12.5px;margin:0">Starting something new replaces your saved game.</p>' : ''}
    ${Remote.available() && !(Remote.me() && !Remote.me().guest) ? (Remote.optedOut() ? '<p style="color:var(--muted);font-size:12.5px;margin:0">Recording is off. <button type="button" class="btn link" id="ovRecOn">Turn it on</button></p>' : '<p style="color:var(--muted);font-size:12.5px;margin:0">Game sessions are recorded. <button type="button" class="btn link" id="ovRecOff">Don’t record my games</button></p>') : ''}`);
  const g = $('#ovGo'); if (g) g.onclick = () => { S = saved; save(); play(); };
  $('#ovTrain').onclick = () => startGame({ tutorial:true });
  $('#ovNew').onclick = () => startGame();
  $('#ovScen').onclick = scenarioPicker;
  const ac = $('#ovAcct'); if (ac) ac.onclick = () => accountScreen();
  const ro = $('#ovRecOff'); if (ro) ro.onclick = () => { Remote.setOptedOut(true); titleScreen(); };
  const rn = $('#ovRecOn'); if (rn) rn.onclick = () => { Remote.setOptedOut(false); titleScreen(); };
}

function start(data){
  if (data && data.save){ try { S = migrate(JSON.parse(data.save)); play(); return; } catch (e) {} }
  if (data && data.fresh){ startGame(); return; }
  dispatch({ type:"newGame" }); begin3(); Scene.setView('hall', true); // a live hall behind the title screen
  S = null; titleScreen();
}
window.claude?.hot?.snapshot?.(() => (S ? { save: JSON.stringify(S) } : {}));
const boot = d => {
  start(d || {});
  Remote.init().then(() => {
    const q = new URLSearchParams(location.search);
    if (q.get('reset')) resetScreen(q.get('reset'));
    else if (q.get('confirmed')){ history.replaceState(null, '', location.pathname); if (!S) accountScreen('Email confirmed. Sign in to continue.'); }
    else if (!S && !$('#ov').hidden) titleScreen();           // show the signed-in state on the title screen
  });
};
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (S) Scene.boards(); });
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
